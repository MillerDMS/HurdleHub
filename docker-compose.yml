
services:
  database:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: devtrack
      POSTGRES_USER: devtrack
      POSTGRES_PASSWORD: devtrack_dev_password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: